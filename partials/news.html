
<div class="container bg-light shadow-lg" style="border-style:solid; border-color: #283869; border-radius: 2em; margin-bottom: 1em;">
    <div class="container px-3 py-5">
        <h3>News | Eventi | Gallery</h3>
        <hr>
        <br>
        <h3><i>Dalla nostra pagina Facebook</i></h3>
        <br>
        <div id="carouselExampleDark" class="carousel carousel-dark slide text-center" data-bs-ride="carousel" style="height: 50%;">
            <div class="carousel-inner">
                <div id="iframe"></div>
                <div class="carousel-indicators mt-5">
                    <button type="button" style="width: 2em;" data-bs-target="#carouselExampleDark" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="2" aria-label="Slide 3"></button>
                    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="3" aria-label="Slide 4"></button>
                    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="4" aria-label="Slide 5"></button>
                </div>
            </div>
        </div>

        <br><br>

        <h3>Eventi</h3>
        <hr>
        <br>

        <div id="locandine" class="carousel carousel-dark slide text-center" data-bs-ride="carousel" style="height: 35em;">
            <div class="carousel-inner" id="carousel-events-inner">
                <!-- Messaggio di caricamento iniziale -->
                <div class="carousel-item active mb-5">
                    <div class="py-5 text-muted">Caricamento eventi in corso...</div>
                </div>
            </div>
        
            <!-- Indicatori in basso generati dinamici -->
            <div class="carousel-indicators mt-5" id="carousel-events-indicators"></div>
        </div>

        <br><br>

        <h3>Galleria</h3>
        <hr>
        <br>

        <div class="container">
            <!-- Spinner di caricamento (opzionale) -->
            <div id="loading" class="text-center my-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="sr-only">Caricamento immagini...</span>
                </div>
            </div>
        
            <!-- Qui verranno inserite le righe con le immagini -->
            <div id="gallery-container"></div>
        </div>
    </div>
</div>

<script src="./js/news.js"></script>
